<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e121b" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e06b3a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#e06b3a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Corner Tech Accent Dots -->
  <circle cx="11" cy="11" r="2" fill="#e06b3a" />
  <circle cx="53" cy="53" r="2" fill="#f59e0b" />

  <!-- Monogram ES Text -->
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="-1">ES</text>
</svg>
